<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Panel de operador</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="handleLogout()">Cerrar sesión</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>
        Bienvenido, {{ currentSession()?.username }}
      </ion-card-title>
      <ion-card-subtitle>
        Rol: {{ currentSession()?.role }}
      </ion-card-subtitle>
    </ion-card-header>
  </ion-card>
</ion-content>
