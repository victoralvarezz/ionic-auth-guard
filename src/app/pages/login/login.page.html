
<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Control de acceso</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card>

    <ion-card-header>
      <ion-card-title>Iniciar sesión</ion-card-title>
      <ion-card-subtitle>
        Introduce tus credenciales
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>

      <!-- Usuario -->
      <ion-item>
        <ion-input
          label="Usuario"
          labelPlacement="stacked"
          type="text"
          placeholder="Introduce tu usuario"
          [(ngModel)]="username">
        </ion-input>
      </ion-item>

      <!-- Contraseña oculta -->
      <ion-item>
        <ion-input
          label="Contraseña"
          labelPlacement="stacked"
          type="password"
          placeholder="Introduce tu contraseña"
          [(ngModel)]="password">
        </ion-input>
      </ion-item>

      <!-- Boton -->
      <ion-button
        expand="block"
        class="ion-margin-top"
        (click)="handleLogin()">
        Iniciar sesión
      </ion-button>

      <!-- Mensaje de error -->
      @if (errorMessage) {
        <ion-text color="danger">
          <p>{{ errorMessage }}</p>
        </ion-text>
      }

    </ion-card-content>

  </ion-card>

</ion-content>
